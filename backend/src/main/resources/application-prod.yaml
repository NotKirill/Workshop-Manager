spring:
  application:
    name: workshop-manager-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/workshop_manager
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    hikari:
      data-source-properties: stringtype=unspecified
  servlet:
    multipart:
      max-file-size: 21MB
      max-request-size: 22MB
      file-size-threshold: 2MB
  liquibase:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.type.json_format_mapper: jackson3
  cache:
    type: redis
  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD}
      timeout: 1s
      connect-timeout: 2s
  quartz:
    job-store-type: jdbc
    jdbc:
      initialize-schema: never
    startup-delay: 5s
    wait-for-jobs-to-complete-on-shutdown: true
    overwrite-existing-jobs: false
    properties:
      org:
        quartz:
          scheduler:
            instanceId: AUTO
          jobStore:
            driverDelegateClass: org.quartz.impl.jdbcjobstore.PostgreSQLDelegate
            isClustered: true
          threadPool:
            threadCount: 5
application:
  frontend:
    url: ${FRONTEND_URL}
  scheduler:
    job-group-name: WORKSHOP-MANAGER
  security:
    jwt:
      secret-key: ${JWT_SECRET_KEY}
      expiration-seconds: 300
    refresh-token:
      expiration-seconds: 604800
      cleaning-job:
        enabled: true
        cron: "0 0 0 1 * ? *"
        retention-after-expiration: 30d
    openid:
      link-token-ttl: 15m
      nonce:
        max-age-minutes: 5
        allowed-future-skew-minutes: 5
        cleaning-job:
          enabled: true
          cron: "0 0 0 1 * ? *"
          retention: 30d
  one-time-code:
    default-ttl: 3m
  storage:
    type: S3
    s3:
      endpoint: http://localhost:8333
      region: us-east-1
      bucket: workshop-manager
      access-key: ${S3_ACCESS_KEY}
      secret-key: ${S3_SECRET_KEY}
      create-bucket: true
  content:
    # /tmp may be RAM-backed and is emptied on reboot
    temp-dir: /var/lib/workshop-manager/content-tmp
    download-link-ttl: 10m
    default-max-revisions: 3
    housekeeping-cron: "0 30 3 * * ? *"
    jobs:
      enabled: true
      interval: 30s
      batch-size: 3
      max-attempts: 5
      retry-base-delay: 1m
      running-timeout: 2h
      history-retention: 30d
  media:
    max-image-size: 20MB
    download-link-ttl: 1h
    sync-enabled: true
    sync-interval: 1m
    sync-batch-size: 20
    sync-max-failures: 5
    sync-retry-base-delay: 5m
    download-timeout: 30s
  items:
    max-dependency-depth: 3
    max-dependency-items: 200
    sync:
      enabled: true
      cron: "0 0 */6 * * ? *"
      stale-after: 24h
      batch-size: 500
  authors:
    refresh:
      enabled: true
      cron: "0 45 * * * ? *"
      stale-after: 7d
      batch-size: 30
  games:
    lookup:
      enabled: true
      interval: 1m
      max-per-run: 15
  modspace:
    steam:
      web-api-key: ${STEAM_WEB_API_KEY:}
      batch-min-size: 70
      batch-max-size: 100
      steamcmd:
        # The steamcmd service of compose.yaml
        url: http://127.0.0.1:8095
        downloads-dir: /var/lib/workshop-manager/steam-downloads
        timeout: 30m
  bootstrap:
    admin:
      username: ${BOOTSTRAP_ADMIN_USERNAME:}
      password: ${BOOTSTRAP_ADMIN_PASSWORD:}
      name: Administrator
      steam-id: ${BOOTSTRAP_ADMIN_STEAM_ID:}
