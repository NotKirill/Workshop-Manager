spring:
  application:
    name: workshop-manager-backend-dev
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:5433/workshop_manager
    username: dev
    password: dev
    hikari:
      data-source-properties: stringtype=unspecified
  liquibase:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.type.json_format_mapper: jackson3
  cache:
    type: redis
  data:
    redis:
      host: localhost
      port: 6380
      password: devpass
      timeout: 1s
      connect-timeout: 2s
  quartz:
    job-store-type: jdbc
    jdbc:
      initialize-schema: never
    startup-delay: 5s
    wait-for-jobs-to-complete-on-shutdown: true
    overwrite-existing-jobs: false
    properties:
      org:
        quartz:
          scheduler:
            instanceId: AUTO
          jobStore:
            driverDelegateClass: org.quartz.impl.jdbcjobstore.PostgreSQLDelegate
            isClustered: true
          threadPool:
            threadCount: 5
application:
  frontend:
    url: http://localhost:3000
  scheduler:
    job-group-name: WORKSHOP-MANAGER
  security:
    jwt:
      secret-key: mBAEd2D1Ce1d6nwGMepFnhOIpJwxQPJskBhcwIcAyW2
      expiration-seconds: 300
    refresh-token:
      expiration-seconds: 604800
      cleaning-job:
        enabled: true
        cron: "0 0 0 1 * ? *"
        retention-after-expiration: 30d
    openid:
      link-token-ttl: 15m
      nonce:
        max-age-minutes: 5
        allowed-future-skew-minutes: 5
        cleaning-job:
          enabled: true
          cron: "0 0 0 1 * ? *"
          retention: 30d
  one-time-code:
    default-ttl: 3m
  items:
    max-dependency-depth: 3
    max-dependency-items: 200
    sync:
      enabled: true
      cron: "0 0 */6 * * ? *"
      stale-after: 24h
      batch-size: 500
  authors:
    refresh:
      enabled: true
      cron: "0 45 * * * ? *"
      stale-after: 7d
      batch-size: 30
  modspace:
    steam:
      web-api-key: ${STEAM_WEB_API_KEY:}
      batch-min-size: 70
      batch-max-size: 100
  bootstrap:
    admin:
      username: admin
      password: Admin123!dev
      name: Dev Admin
      steam-id: ${BOOTSTRAP_ADMIN_STEAM_ID:}
