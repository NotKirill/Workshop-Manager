databaseChangeLog:
  - changeSet:
      id: 004
      author: NotKirill
      changes:
        - createTable:
            tableName: game_metadata
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_game_metadata
                    nullable: false
              - column:
                  name: name
                  type: TEXT
                  constraints:
                    nullable: false
        - createTable:
            tableName: game_to_modspace_ids
            constraints:
              uniqueConstraints:
                - columnNames: source_modspace, external_id
                  constraintName: uk_game_to_modspace_id_identity
            columns:
              - column:
                  name: game_id
                  type: BIGINT
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_game_to_modspace_id
                    nullable: false
              - column:
                  name: source_modspace
                  type: modspace_type
                  constraints:
                    nullable: false
              - column:
                  name: external_id
                  type: TEXT
                  constraints:
                    nullable: false
        - createTable:
            tableName: game_compatibility
            columns:
              - column:
                  name: source_game_id
                  type: BIGINT
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_game_compatibility
                    nullable: false
              - column:
                  name: target_game_id
                  type: BIGINT
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_game_compatibility
                    nullable: false