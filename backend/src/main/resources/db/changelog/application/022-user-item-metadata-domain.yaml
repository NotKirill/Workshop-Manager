databaseChangeLog:
  - changeSet:
      id: "022-manual-rollback"
      author: NotKirill
      changes:
        - dropUniqueConstraint:
            tableName: user_groups
            constraintName: uk_user_group_identity
      rollback:
        - addUniqueConstraint:
            tableName: user_groups
            columnNames: user_id, game_id
            constraintName: uk_user_group_identity
  - changeSet:
      id: "022"
      author: NotKirill
      changes:
        - addUniqueConstraint:
            tableName: user_groups
            columnNames: user_id, game_id, name
            constraintName: uk_user_group_identity
        - addColumn:
            tableName: user_tags
            columns:
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
        - addNotNullConstraint:
            tableName: user_tags
            columnName: display_name
            columnDataType: TEXT
        - addUniqueConstraint:
            tableName: user_tags
            columnNames: user_id, game_id, display_name
            constraintName: uk_user_tag_identity
