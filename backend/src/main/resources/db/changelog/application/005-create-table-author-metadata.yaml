databaseChangeLog:
  - changeSet:
      id: "005"
      author: NotKirill
      changes:
        - createTable:
            tableName: author_metadata
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_author_metadata
                    nullable: false
              - column:
                  name: source_modspace
                  type: modspace_type
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_author_metadata_identity
              - column:
                  name: original_id
                  type: TEXT
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_author_metadata_identity
              - column:
                  name: name
                  type: TEXT
                  constraints:
                    nullable: false