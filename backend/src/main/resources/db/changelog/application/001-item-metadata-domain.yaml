databaseChangeLog:
  - changeSet:
      id: 001
      author: NotKirill
      changes:
        - sql:
            dbms: postgresql
            sql: CREATE TYPE modspace_type AS ENUM ('LOCAL', 'UNKNOWN', 'STEAM')
            rollback:
              - sql:
                  dbms: postgresql
                  sql: DROP TYPE modspace_type;
        - createTable:
            tableName: item_metadata_internal
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_item_metadata_internal
                    nullable: false
              - column:
                  name: source_modspace
                  type: modspace_type
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_item_metadata_internal_identity
              - column:
                  name: game_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_item_metadata_internal_identity
              - column:
                  name: original_id
                  type: TEXT
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_item_metadata_internal_identity
              - column:
                  name: time_registered
                  type: TIMESTAMPTZ
                  defaultValueComputed: NOW()
                  constraints:
                    nullable: false
              - column:
                  name: time_updated
                  type: TIMESTAMPTZ
                  constraints:
                    nullable: false
        - createTable:
            tableName: item_metadata_personal
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_item_metadata_personal
                    nullable: false
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_item_metadata_personal_identity
              - column:
                  name: internal_metadata_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_item_metadata_personal_identity
              - column:
                  name: title
                  type: TEXT
              - column:
                  name: description
                  type: TEXT
              - column:
                  name: user_commentary
                  type: TEXT
              - column:
                  name: metadata_only
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: content_import
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false