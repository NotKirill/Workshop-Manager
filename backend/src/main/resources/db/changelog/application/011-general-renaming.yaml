databaseChangeLog:
  - changeSet:
      id: "011-types"
      author: NotKirill
      changes:
        - sql:
            dbms: postgresql
            sql: CREATE TYPE storing_strategy AS ENUM ('ONLY_METADATA', 'ALLOW_CONTENT_IMPORT', 'AUTO_CONTENT_IMPORT')
        - sql:
            dbms: postgresql
            sql: ALTER TYPE auth_provider RENAME VALUE 'LOCAL_LOGIN' TO 'LOCAL_USERNAME';
        - sql:
            dbms: postgresql
            sql: ALTER TYPE auth_provider RENAME TO auth_source;
      rollback:
        - sql:
            dbms: postgresql
            sql: ALTER TYPE auth_source RENAME TO auth_provider
        - sql:
            dbms: postgresql
            sql: ALTER TYPE auth_provider RENAME VALUE 'LOCAL_USERNAME' TO 'LOCAL_LOGIN'
        - sql:
            dbms: postgresql
            sql: DROP TYPE storing_strategy
  - changeSet:
      id: "011-manual-rollback"
      author: NotKirill
      changes:
        - dropColumn:
            tableName: item_metadata_personal
            columns:
              - column:
                  name: content_import
        - dropColumn:
            tableName: item_metadata_personal
            columns:
              - column:
                  name: metadata_only
      rollback:
        - addColumn:
            tableName: item_metadata_personal
            columns:
              - column:
                  name: metadata_only
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: content_import
                  type: BOOLEAN
                  defaultValueBoolean: false
                  constraints:
                    nullable: false
  - changeSet:
      id: "011"
      author: NotKirill
      changes:
        - addColumn:
            tableName: item_metadata_personal
            columns:
              - column:
                  name: storing_mode
                  type: storing_strategy
                  defaultValueComputed: "'ONLY_METADATA'::storing_strategy"
                  constraints:
                    nullable: false
        - renameColumn:
            tableName: steam_workshop_tags
            oldColumnName: tag
            newColumnName: tag_key
        - renameColumn:
            tableName: users
            oldColumnName: permissions_ids
            newColumnName: permission_ids