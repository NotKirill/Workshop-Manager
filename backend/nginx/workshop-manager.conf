server_tokens off;

# Request limits per client IP: a rate, plus a burst that is let through at once
limit_req_zone  $binary_remote_addr zone=login:10m       rate=10r/m;  # password sign-in
limit_req_zone  $binary_remote_addr zone=steam_login:10m rate=6r/m;   # Steam sign-in start and callbacks
limit_req_zone  $binary_remote_addr zone=auth:10m        rate=30r/m;  # token refresh, one-time tokens, logout
limit_req_zone  $binary_remote_addr zone=api:10m         rate=10r/s;  # everything else under /api/
limit_conn_zone $binary_remote_addr zone=per_ip:10m;

limit_req_status    429;
limit_conn_status   429;
limit_req_log_level warn;

upstream backend {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;

    location = /nginx-health {
        access_log off;
        return 204;
    }

    # Let's Encrypt HTTP challenge (certbot --webroot -w <ACME_WEBROOT>)
    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    set $retry_after 1;

    # Requests in progress per IP: stops floods of slow requests
    limit_conn per_ip 50;
    client_max_body_size 10m;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 330s;

    error_page 429 = @too_many_requests;
    error_page 413 = @too_large;

    location = /api/auth/login {
        set $retry_after 6;
        limit_req zone=login burst=10 nodelay;
        client_max_body_size 64k;
        proxy_pass http://backend;
    }

    location = /api/auth/password {
        set $retry_after 6;
        limit_req zone=login burst=10 nodelay;
        client_max_body_size 64k;
        proxy_pass http://backend;
    }

    location /api/auth/steam {
        set $retry_after 10;
        limit_req zone=steam_login burst=10 nodelay;
        client_max_body_size 64k;
        proxy_pass http://backend;
    }

    location /api/auth/ {
        set $retry_after 2;
        limit_req zone=auth burst=30 nodelay;
        client_max_body_size 64k;
        proxy_pass http://backend;
    }

    # Images: up to 20 MB (application.media.max-image-size)
    location ~ ^/api/items/\d+/media/upload$ {
        limit_req zone=api burst=100 nodelay;
        client_max_body_size 21m;
        proxy_pass http://backend;
    }

    # Backups arrive in parts of up to 16 MB (application.content.upload-chunk-size). nginx buffers a part, so a slow
    # client never holds a backend thread; the last part stores the whole file (up to 4 GB), hence the long timeout
    location ~ ^/api/items/\d+/content/uploads {
        limit_req zone=api burst=100 nodelay;
        client_max_body_size 17m;
        proxy_read_timeout 1h;
        proxy_pass http://backend;
    }

    # Backups (up to 4 GB) stream through; a client that stops reading holds a backend thread, hence the low limit
    location /api/public/downloads/content/ {
        limit_req zone=api burst=100 nodelay;
        limit_conn per_ip 10;
        proxy_buffering off;
        proxy_pass http://backend;
    }

    location /api/ {
        limit_req zone=api burst=100 nodelay;
        proxy_pass http://backend;
    }

    # Frontend, served by the backend
    location / {
        proxy_pass http://backend;
    }

    # Same body shape as the backend errors, so the frontend shows its own texts
    location @too_many_requests {
        default_type application/json;
        add_header Retry-After $retry_after always;
        return 429 '{"status":429,"code":"RATE_LIMIT_EXCEEDED"}';
    }

    location @too_large {
        default_type application/json;
        return 413 '{"status":413,"code":"UPLOAD_TOO_LARGE"}';
    }
}
