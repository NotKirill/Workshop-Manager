name: workshop-manager-dev

services:
  postgres:
    image: postgres:17.10
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: workshop_manager
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  redis:
    image: redis:8.8.0
    restart: unless-stopped
    volumes:
      - redis_data:/data
    environment:
      REDIS_PASSWORD: devpass
    ports:
      - "127.0.0.1:6380:6379"
    command: sh -c "redis-server --requirepass $$REDIS_PASSWORD"
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    restart: unless-stopped
    command: server -dir=/data -s3 -s3.port=8333
    volumes:
      - seaweedfs_data:/data
    environment:
      AWS_ACCESS_KEY_ID: devseaweed
      AWS_SECRET_ACCESS_KEY: devseaweed-secret
    ports:
      - "127.0.0.1:8334:8333"
    healthcheck:
      test: [ "CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/healthz" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
  steamcmd:
    build:
      context: ./steamcmd
      args:
        UID: ${APP_UID:-1000}
        GID: ${APP_GID:-1000}
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    logging:
      options:
        max-size: 10m
        max-file: "3"
    volumes:
      - /tmp/workshop-manager-steam-downloads:/downloads
      - steamcmd_data:/opt/steamcmd
    ports:
      - "127.0.0.1:8096:8095"
    healthcheck:
      test: [ "CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8095/health" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
  prometheus:
    image: prom/prometheus:v3.16.0
    restart: unless-stopped
    network_mode: host
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.listen-address=127.0.0.1:9091
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    logging:
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test: [ "CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9091/-/ready" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
  grafana:
    image: grafana/grafana:13.3.1
    restart: unless-stopped
    network_mode: host
    depends_on:
      - prometheus
    environment:
      GF_SERVER_HTTP_ADDR: 127.0.0.1
      GF_SERVER_HTTP_PORT: "3101"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      PROMETHEUS_PORT: "9091"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    logging:
      options:
        max-size: 10m
        max-file: "3"
    healthcheck:
      test: [ "CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3101/api/health" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
  # docker compose -f compose.dev.yaml --profile seed run --rm seed
  seed:
    profiles: [ seed ]
    build: ./dev/seed
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: dev
      PGPASSWORD: dev
      PGDATABASE: workshop_manager
      S3_ENDPOINT: http://seaweedfs:8333
      S3_REGION: us-east-1
      S3_BUCKET: workshop-manager
      S3_ACCESS_KEY: devseaweed
      S3_SECRET_KEY: devseaweed-secret
      REDIS_HOST: redis
      REDIS_PASSWORD: devpass
      ADMIN_STEAM_ID: ${BOOTSTRAP_ADMIN_STEAM_ID:-}
    volumes:
      - ./dev/seed:/seed:ro

volumes:
  postgres_data:
  redis_data:
  seaweedfs_data:
  steamcmd_data:
  prometheus_data:
  grafana_data:
